[package]
name = "dnf-avatar-studio"
version = "1.7.0"
description = "DNF avatar set preview and NPK IMG compositor"
authors = ["PhysicalWorldDo"]
edition = "2021"
default-run = "dnf-avatar-studio"

[lib]
name = "dnf_avatar_studio_lib"
crate-type = ["rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
color_quant = "1"
encoding_rs = "0.8"
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["webp"] }
libloading = "0.8"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
